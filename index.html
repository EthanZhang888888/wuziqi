<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五子棋 - 高精度胜率</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            touch-action: none;
            user-select: none;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 50% 40%, rgba(60, 80, 140, 0.15) 0%, transparent 60%),
                linear-gradient(180deg, #0d0d1a 0%, #1a1a30 50%, #0d0d1a 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            gap: 6px;
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        .header .title {
            font-size: clamp(16px, 3vw, 24px);
            font-weight: 700;
            color: #ffd700;
            letter-spacing: 2px;
        }
        .header .turn {
            font-size: clamp(13px, 2vw, 18px);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .turn .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }
        .header .turn .dot.black {
            background: radial-gradient(circle at 35% 35%, #555, #111);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
        }
        .header .turn .dot.white {
            background: radial-gradient(circle at 35% 35%, #fff, #ccc);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }
        .header .turn .label {
            color: rgba(255, 255, 255, 0.7);
        }
        .header .turn .label.active {
            color: #ffd700;
        }

        .mode-bar {
            width: 100%;
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            padding: 2px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .mode-bar button {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 6px;
            font-size: clamp(11px, 1.6vw, 15px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            color: rgba(255, 255, 255, 0.35);
        }
        .mode-bar button.active {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }
        .mode-bar button:active {
            transform: scale(0.95);
        }

        .board-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            gap: 10px;
            padding: 4px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .board-container {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .board {
            width: 100%;
            height: 100%;
            aspect-ratio: 1;
            max-width: min(75vh, 85vw);
            max-height: min(75vh, 85vw);
            background: radial-gradient(ellipse at center, #d4a56a, #b8894a);
            border-radius: 8px;
            box-shadow:
                inset 0 0 40px rgba(0, 0, 0, 0.3),
                0 10px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            touch-action: none;
        }

        #canvas {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: block;
            touch-action: none;
            cursor: pointer;
        }

        /* 胜率面板 */
        .stats-panel {
            width: 130px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 8px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .stats-panel.hidden {
            width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
            opacity: 0;
        }
        .stats-panel .stat-title {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            letter-spacing: 1px;
            padding-bottom: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding: 3px 6px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.15);
        }
        .stat-item .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-item .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        .stat-item .value {
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .stat-item .value.black-win {
            color: #ddd;
        }
        .stat-item .value.white-win {
            color: #fff;
        }
        .stat-item .value.draw {
            color: #ffd700;
        }
        .stat-bar {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }
        .stat-bar .fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .stat-bar .fill.black {
            background: linear-gradient(90deg, #555, #aaa);
        }
        .stat-bar .fill.white {
            background: linear-gradient(90deg, #aaa, #fff);
        }
        .stat-bar .fill.draw {
            background: linear-gradient(90deg, #b8860b, #ffd700);
        }

        .stat-confidence {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            padding-top: 2px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-toggle {
            width: 100%;
            padding: 4px 0;
            border: none;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
        }
        .stat-toggle.active {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
        }
        .stat-toggle:active {
            transform: scale(0.92);
        }

        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding: 4px 14px;
            min-height: 32px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            gap: 8px;
        }
        .footer .msg {
            font-size: clamp(11px, 1.4vw, 14px);
            color: rgba(255, 255, 255, 0.5);
            flex: 1;
            text-align: center;
        }
        .footer .msg .highlight {
            color: #ffd700;
        }
        .footer .msg .sim-status {
            color: rgba(255, 255, 255, 0.2);
            font-size: 10px;
            margin-left: 6px;
        }
        .footer button {
            padding: 4px 16px;
            border: none;
            border-radius: 6px;
            font-size: clamp(11px, 1.2vw, 14px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .footer button:active {
            transform: scale(0.92);
        }
        .footer button.reset {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        .footer button.undo {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        @media (max-width: 550px) {
            .container { padding: 6px; gap: 4px; }
            .header { padding: 4px 10px; min-height: 28px; }
            .header .title { font-size: 14px; }
            .header .turn { font-size: 12px; }
            .header .turn .dot { width: 10px; height: 10px; }
            .mode-bar button { padding: 4px 0; font-size: 10px; }
            .board-wrapper { padding: 3px; gap: 6px; flex-wrap: wrap; }
            .stats-panel { width: 100%; flex-direction: row; padding: 4px 8px; gap: 3px; flex-wrap: wrap; justify-content: center; }
            .stats-panel.hidden { width: 0; padding: 0; }
            .stats-panel .stat-title { display: none; }
            .stat-item { padding: 2px 6px; flex-direction: row; gap: 4px; align-items: center; }
            .stat-item .row { gap: 4px; }
            .stat-item .value { font-size: 13px; }
            .stat-bar { width: 30px; height: 3px; }
            .stat-confidence { display: none; }
            .stat-toggle { padding: 2px 8px; font-size: 9px; width: auto; }
            .footer { padding: 3px 10px; min-height: 26px; }
            .footer button { padding: 3px 10px; font-size: 10px; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .board { max-width: min(55vh, 65vw); max-height: min(55vh, 65vw); }
            .header { min-height: 22px; padding: 2px 10px; }
            .header .title { font-size: 14px; }
            .header .turn { font-size: 11px; }
            .footer { min-height: 22px; padding: 2px 10px; }
            .stats-panel { width: 100px; padding: 4px; }
            .stat-item .value { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div class="container">
        <div class="header">
            <span class="title">⚫ 五子棋</span>
            <span class="turn" id="turnIndicator">
                <span class="dot black" id="turnDot"></span>
                <span class="label active" id="turnLabel">黑棋走</span>
            </span>
        </div>

        <div class="mode-bar">
            <button class="active" data-mode="pvp" onclick="setMode('pvp')">👥 双人对战</button>
            <button data-mode="pve" onclick="setMode('pve')">🤖 人机对战</button>
        </div>

        <div class="board-wrapper">
            <div class="board-container">
                <div class="board" id="boardContainer">
                    <canvas id="canvas"></canvas>
                </div>
            </div>

            <div class="stats-panel" id="statsPanel">
                <div class="stat-title">📊 胜率分析</div>

                <div class="stat-item">
                    <div class="row">
                        <span class="label">⚫ 黑胜</span>
                        <span class="value black-win" id="blackWinRate">0%</span>
                    </div>
                    <div class="stat-bar"><div class="fill black" id="blackBar" style="width:0%"></div></div>
                </div>

                <div class="stat-item">
                    <div class="row">
                        <span class="label">⚪ 白胜</span>
                        <span class="value white-win" id="whiteWinRate">0%</span>
                    </div>
                    <div class="stat-bar"><div class="fill white" id="whiteBar" style="width:0%"></div></div>
                </div>

                <div class="stat-item">
                    <div class="row">
                        <span class="label">🤝 平局</span>
                        <span class="value draw" id="drawRate">0%</span>
                    </div>
                    <div class="stat-bar"><div class="fill draw" id="drawBar" style="width:0%"></div></div>
                </div>

                <div class="stat-confidence" id="confidenceInfo">置信度: 高 (500次模拟)</div>

                <button class="stat-toggle active" id="statToggle" onclick="toggleStats()">📊 隐藏胜率</button>
            </div>
        </div>

        <div class="footer">
            <span class="msg" id="message">⚫ 黑棋先走 <span class="sim-status" id="simStatus"></span></span>
            <button class="undo" onclick="undoMove()">↩ 悔棋</button>
            <button class="reset" onclick="resetGame()">🔄 重开</button>
        </div>
    </div>

    <script>
        // ================================================================
        // 五子棋 - 高精度胜率版
        // 优化: 500次模拟 + 智能走法 + 异步计算 + 进度提示
        // ================================================================

        const SIZE = 15;
        const EMPTY = 0;
        const BLACK = 1;
        const WHITE = 2;
        const SIMULATIONS = 500; // 模拟次数提升到500次

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const boardContainer = document.getElementById('boardContainer');
        const turnDot = document.getElementById('turnDot');
        const turnLabel = document.getElementById('turnLabel');
        const messageEl = document.getElementById('message');
        const simStatusEl = document.getElementById('simStatus');

        const blackWinRateEl = document.getElementById('blackWinRate');
        const whiteWinRateEl = document.getElementById('whiteWinRate');
        const drawRateEl = document.getElementById('drawRate');
        const blackBarEl = document.getElementById('blackBar');
        const whiteBarEl = document.getElementById('whiteBar');
        const drawBarEl = document.getElementById('drawBar');
        const confidenceInfoEl = document.getElementById('confidenceInfo');
        const statsPanel = document.getElementById('statsPanel');
        const statToggle = document.getElementById('statToggle');

        let board = [];
        let currentPlayer = BLACK;
        let gameOver = false;
        let winner = null;
        let moveHistory = [];
        let mode = 'pvp';
        let isAIThinking = false;
        let showStats = true;
        let isSimulating = false;

        let cellSize = 0;
        let padding = 0;
        let canvasSize = 0;

        const DIRS = [
            [1, 0],
            [0, 1],
            [1, 1],
            [1, -1]
        ];

        // ================================================================
        // 胜率计算 (蒙特卡洛模拟 - 优化版)
        // ================================================================

        function calculateWinRates() {
            if (gameOver) {
                if (winner === BLACK) {
                    setStats(100, 0, 0);
                } else if (winner === WHITE) {
                    setStats(0, 100, 0);
                } else {
                    setStats(0, 0, 100);
                }
                confidenceInfoEl.textContent = '✅ 游戏已结束';
                return;
            }

            if (isSimulating) return;
            isSimulating = true;
            simStatusEl.textContent = '⏳ 计算中...';

            // 使用 requestAnimationFrame + setTimeout 分片计算，不阻塞界面
            setTimeout(() => {
                const result = monteCarloSimulation(SIMULATIONS);
                setStats(result.black, result.white, result.draw);

                // 显示置信度
                const confidence = result.confidence || '高';
                confidenceInfoEl.textContent = `置信度: ${confidence} (${SIMULATIONS}次模拟)`;

                isSimulating = false;
                simStatusEl.textContent = '✓';
                setTimeout(() => { simStatusEl.textContent = ''; }, 1500);
            }, 30);
        }

        function setStats(black, white, draw) {
            blackWinRateEl.textContent = black + '%';
            whiteWinRateEl.textContent = white + '%';
            drawRateEl.textContent = draw + '%';
            blackBarEl.style.width = black + '%';
            whiteBarEl.style.width = white + '%';
            drawBarEl.style.width = draw + '%';
        }

        // -------- 蒙特卡洛模拟 (优化版) --------
        function monteCarloSimulation(iterations) {
            let blackWins = 0,
                whiteWins = 0,
                draws = 0;

            // 收集空位
            const emptyCells = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === EMPTY) emptyCells.push({ row: r, col: c });
                }
            }

            if (emptyCells.length === 0) {
                return { black: 0, white: 0, draw: 100, confidence: '高' };
            }

            // 如果空位太多，取前60个进行模拟（平衡速度）
            const maxSample = Math.min(emptyCells.length, 60);
            const sampled = emptyCells.slice(0, maxSample);

            // 预先计算每个位置的评分（缓存）
            const scores = sampled.map(pos => {
                const attackScore = evaluatePositionFast(pos.row, pos.col, currentPlayer);
                const defenseScore = evaluatePositionFast(pos.row, pos.col, currentPlayer === BLACK ? WHITE : BLACK);
                return {
                    ...pos,
                    score: attackScore * 1.2 + defenseScore
                };
            });

            // 按评分排序
            scores.sort((a, b) => b.score - a.score);

            // 只取评分最高的前20个位置进行模拟（大幅提高准确性）
            const topCandidates = scores.slice(0, Math.min(20, scores.length));

            // 如果候选太少，补充一些随机位置
            while (topCandidates.length < 5 && scores.length > 0) {
                const remaining = scores.filter(s => !topCandidates.includes(s));
                if (remaining.length === 0) break;
                topCandidates.push(remaining[Math.floor(Math.random() * remaining.length)]);
            }

            // 进行模拟
            for (let i = 0; i < iterations; i++) {
                // 复制棋盘
                const simBoard = board.map(row => [...row]);

                // 随机选择一个候选位置落子
                const candidate = topCandidates[Math.floor(Math.random() * topCandidates.length)];
                if (!candidate) { draws++; continue; }

                // 模拟落子（用当前玩家）
                simBoard[candidate.row][candidate.col] = currentPlayer;

                // 检查是否赢了
                if (checkWinOnBoard(simBoard, candidate.row, candidate.col, currentPlayer)) {
                    if (currentPlayer === BLACK) blackWins++;
                    else whiteWins++;
                    continue;
                }

                // 检查是否平局
                let isFull = true;
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        if (simBoard[r][c] === EMPTY) { isFull = false; break; }
                    }
                    if (!isFull) break;
                }
                if (isFull) { draws++; continue; }

                // 用随机走法继续模拟（简化版）
                let simPlayer = currentPlayer === BLACK ? WHITE : BLACK;
                let simGameOver = false;
                let simWinner = null;

                // 最多模拟50步
                for (let step = 0; step < 50; step++) {
                    // 收集空位
                    const empties = [];
                    for (let r = 0; r < SIZE; r++) {
                        for (let c = 0; c < SIZE; c++) {
                            if (simBoard[r][c] === EMPTY) empties.push({ row: r, col: c });
                        }
                    }
                    if (empties.length === 0) { simGameOver = true; break; }

                    // 随机选择位置（但倾向于高评分位置）
                    const idx = Math.floor(Math.random() * Math.min(empties.length, 10));
                    const pos = empties[idx % empties.length];
                    simBoard[pos.row][pos.col] = simPlayer;

                    // 检查胜利
                    if (checkWinOnBoard(simBoard, pos.row, pos.col, simPlayer)) {
                        simGameOver = true;
                        simWinner = simPlayer;
                        break;
                    }

                    // 切换玩家
                    simPlayer = simPlayer === BLACK ? WHITE : BLACK;
                }

                if (!simGameOver) { draws++; continue; }

                if (simWinner === BLACK) blackWins++;
                else if (simWinner === WHITE) whiteWins++;
                else draws++;
            }

            const total = iterations;
            // 计算置信度
            const maxVariance = Math.max(blackWins, whiteWins, draws) / total;
            let confidence = '中';
            if (maxVariance > 0.6) confidence = '高';
            else if (maxVariance > 0.4) confidence = '中';
            else confidence = '低';

            return {
                black: Math.round((blackWins / total) * 100),
                white: Math.round((whiteWins / total) * 100),
                draw: Math.round((draws / total) * 100),
                confidence: confidence
            };
        }

        // -------- 检查棋盘上的胜利 --------
        function checkWinOnBoard(board, row, col, player) {
            for (const [dr, dc] of DIRS) {
                let count = 1;
                for (let i = 1; i < 5; i++) {
                    const r = row + dr * i,
                        c = col + dc * i;
                    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE || board[r][c] !== player) break;
                    count++;
                }
                for (let i = 1; i < 5; i++) {
                    const r = row - dr * i,
                        c = col - dc * i;
                    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE || board[r][c] !== player) break;
                    count++;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        // -------- 快速评分 (优化版) --------
        function evaluatePositionFast(row, col, player) {
            let totalScore = 0;
            const opponent = player === BLACK ? WHITE : BLACK;

            for (const [dr, dc] of DIRS) {
                // 进攻
                const attack = countDirectionFast(row, col, dr, dc, player);
                totalScore += attack;

                // 防守
                const defense = countDirectionFast(row, col, dr, dc, opponent);
                totalScore += defense * 0.85;
            }

            // 中心加成
            const centerDist = Math.abs(row - 7) + Math.abs(col - 7);
            totalScore += (14 - centerDist) * 1.5;

            return totalScore;
        }

        function countDirectionFast(row, col, dr, dc, player) {
            let count = 1;
            let openLeft = 0,
                openRight = 0;

            for (let i = 1; i < 5; i++) {
                const r = row + dr * i,
                    c = col + dc * i;
                if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) { openRight = 0; break; }
                if (board[r][c] === player) count++;
                else if (board[r][c] === EMPTY) { openRight = 1; break; } else { openRight = 0; break; }
            }
            for (let i = 1; i < 5; i++) {
                const r = row - dr * i,
                    c = col - dc * i;
                if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) { openLeft = 0; break; }
                if (board[r][c] === player) count++;
                else if (board[r][c] === EMPTY) { openLeft = 1; break; } else { openLeft = 0; break; }
            }

            const openEnds = openLeft + openRight;

            // 更精细的评分
            if (count >= 5) return 100000;
            if (count === 4 && openEnds >= 2) return 50000; // 双活四
            if (count === 4 && openEnds === 1) return 10000;
            if (count === 3 && openEnds >= 2) return 3000;
            if (count === 3 && openEnds === 1) return 500;
            if (count === 2 && openEnds >= 2) return 100;
            if (count === 2 && openEnds === 1) return 20;
            if (count === 1 && openEnds > 0) return 5;
            return 0;
        }

        // ================================================================
        // 游戏核心 (与之前相同，略作调整)
        // ================================================================

        function initBoard() {
            board = Array.from({ length: SIZE }, () => new Array(SIZE).fill(EMPTY));
            currentPlayer = BLACK;
            gameOver = false;
            winner = null;
            moveHistory = [];
            isAIThinking = false;
        }

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.mode-bar button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === m);
            });
            resetGame();
        }

        function resetGame() {
            initBoard();
            render();
            updateStatus();
            messageEl.textContent = '⚫ 黑棋先走';
            if (showStats) setTimeout(calculateWinRates, 100);
            if (mode === 'pve' && currentPlayer === WHITE) {
                setTimeout(() => aiMove(), 100);
            }
        }

        function undoMove() {
            if (gameOver) return;
            if (moveHistory.length === 0) return;
            if (mode === 'pve' && moveHistory.length >= 1) {
                const last = moveHistory.pop();
                board[last.row][last.col] = EMPTY;
                if (moveHistory.length > 0) {
                    const last2 = moveHistory.pop();
                    board[last2.row][last2.col] = EMPTY;
                    currentPlayer = last2.player;
                } else {
                    currentPlayer = BLACK;
                }
            } else {
                const last = moveHistory.pop();
                board[last.row][last.col] = EMPTY;
                currentPlayer = last.player;
            }
            gameOver = false;
            winner = null;
            render();
            updateStatus();
            messageEl.textContent = `↩ 已悔棋`;
            if (showStats) setTimeout(calculateWinRates, 100);
            if (mode === 'pve' && currentPlayer === WHITE && !gameOver) {
                setTimeout(() => aiMove(), 150);
            }
        }

        function checkWin(row, col, player) {
            for (const [dr, dc] of DIRS) {
                let count = 1;
                for (let i = 1; i < 5; i++) {
                    const r = row + dr * i,
                        c = col + dc * i;
                    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE || board[r][c] !== player) break;
                    count++;
                }
                for (let i = 1; i < 5; i++) {
                    const r = row - dr * i,
                        c = col - dc * i;
                    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE || board[r][c] !== player) break;
                    count++;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function checkDraw() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === EMPTY) return false;
                }
            }
            return true;
        }

        function placePiece(row, col) {
            if (gameOver) return false;
            if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return false;
            if (board[row][col] !== EMPTY) return false;
            if (mode === 'pve' && isAIThinking) return false;
            if (mode === 'pve' && currentPlayer === WHITE) return false;

            board[row][col] = currentPlayer;
            moveHistory.push({ row, col, player: currentPlayer });

            if (checkWin(row, col, currentPlayer)) {
                gameOver = true;
                winner = currentPlayer;
                render();
                updateStatus();
                const name = currentPlayer === BLACK ? '黑棋' : '白棋';
                messageEl.innerHTML = `🎉 <span class="highlight">${name}</span> 获胜! 🎉`;
                if (showStats) calculateWinRates();
                return true;
            }

            if (checkDraw()) {
                gameOver = true;
                winner = null;
                render();
                updateStatus();
                messageEl.textContent = '🤝 平局!';
                if (showStats) calculateWinRates();
                return true;
            }

            currentPlayer = currentPlayer === BLACK ? WHITE : BLACK;
            render();
            updateStatus();
            if (showStats) setTimeout(calculateWinRates, 50);

            if (mode === 'pve' && !gameOver && currentPlayer === WHITE) {
                isAIThinking = true;
                setTimeout(() => {
                    aiMove();
                }, 50);
            }

            return true;
        }

        // ================================================================
        // AI (优化版)
        // ================================================================

        function aiMove() {
            if (gameOver) return;
            if (currentPlayer !== WHITE) return;
            if (isAIThinking) return;

            isAIThinking = true;

            let bestScore = -1;
            let bestMoves = [];

            const candidates = getCandidates();

            if (candidates.length === 0) {
                const center = Math.floor(SIZE / 2);
                isAIThinking = false;
                placePiece(center, center);
                return;
            }

            for (const pos of candidates) {
                const attackScore = evaluatePositionFast(pos.row, pos.col, WHITE);
                const defenseScore = evaluatePositionFast(pos.row, pos.col, BLACK);
                const score = attackScore * 1.3 + defenseScore * 0.9;

                if (score > bestScore) {
                    bestScore = score;
                    bestMoves = [pos];
                } else if (score === bestScore) {
                    bestMoves.push(pos);
                }
            }

            if (bestMoves.length === 0) {
                isAIThinking = false;
                return;
            }

            const move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            isAIThinking = false;
            placePiece(move.row, move.col);
        }

        function getCandidates() {
            const set = new Set();
            const range = 2;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === EMPTY) continue;
                    for (let dr = -range; dr <= range; dr++) {
                        for (let dc = -range; dc <= range; dc++) {
                            const nr = r + dr,
                                nc = c + dc;
                            if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
                            if (board[nr][nc] !== EMPTY) continue;
                            set.add(`${nr},${nc}`);
                        }
                    }
                }
            }
            const result = [];
            for (const key of set) {
                const [r, c] = key.split(',').map(Number);
                result.push({ row: r, col: c });
            }
            return result;
        }

        // ================================================================
        // 渲染
        // ================================================================

        function render() {
            const rect = boardContainer.getBoundingClientRect();
            const size = Math.min(rect.width, rect.height);
            canvasSize = size;
            canvas.width = size;
            canvas.height = size;

            padding = size * 0.04;
            const boardSize = size - padding * 2;
            cellSize = boardSize / (SIZE - 1);

            ctx.clearRect(0, 0, size, size);

            const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size);
            gradient.addColorStop(0, '#d4a56a');
            gradient.addColorStop(1, '#b8894a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.lineWidth = 1;
            for (let i = 0; i < SIZE; i++) {
                const pos = padding + i * cellSize;
                ctx.beginPath();
                ctx.moveTo(padding, pos);
                ctx.lineTo(padding + (SIZE - 1) * cellSize, pos);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(pos, padding);
                ctx.lineTo(pos, padding + (SIZE - 1) * cellSize);
                ctx.stroke();
            }

            const stars = [
                [3, 3],
                [3, 11],
                [11, 3],
                [11, 11],
                [7, 7]
            ];
            for (const [r, c] of stars) {
                ctx.beginPath();
                ctx.arc(padding + c * cellSize, padding + r * cellSize, cellSize * 0.12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fill();
            }

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === EMPTY) continue;
                    const x = padding + c * cellSize;
                    const y = padding + r * cellSize;
                    const radius = cellSize * 0.42;

                    const g = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);
                    if (board[r][c] === BLACK) {
                        g.addColorStop(0, '#666');
                        g.addColorStop(0.7, '#222');
                        g.addColorStop(1, '#000');
                    } else {
                        g.addColorStop(0, '#ffffff');
                        g.addColorStop(0.7, '#f0f0f0');
                        g.addColorStop(1, '#d0d0d0');
                    }

                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 6;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = g;
                    ctx.fill();

                    ctx.shadowBlur = 0;
                    if (board[r][c] === WHITE) {
                        ctx.beginPath();
                        ctx.arc(x - radius * 0.25, y - radius * 0.25, radius * 0.2, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,0.6)';
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(x - radius * 0.2, y - radius * 0.3, radius * 0.12, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.fill();
                    }
                }
            }

            if (moveHistory.length > 0) {
                const last = moveHistory[moveHistory.length - 1];
                const x = padding + last.col * cellSize;
                const y = padding + last.row * cellSize;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(x, y, cellSize * 0.1, 0, Math.PI * 2);
                ctx.fillStyle = board[last.row][last.col] === BLACK ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.3)';
                ctx.fill();
            }
        }

        function updateStatus() {
            const isBlack = currentPlayer === BLACK && !gameOver;
            const isWhite = currentPlayer === WHITE && !gameOver;

            turnDot.className = `dot ${isBlack ? 'black' : isWhite ? 'white' : ''}`;
            turnLabel.textContent = gameOver ?
                (winner ? (winner === BLACK ? '黑胜' : '白胜') : '平局') :
                (isBlack ? '黑棋走' : '白棋走');
            turnLabel.className = `label ${(isBlack || isWhite) ? 'active' : ''}`;

            if (!gameOver && mode === 'pve' && currentPlayer === WHITE) {
                messageEl.textContent = '🤖 AI 思考中...';
            }
        }

        // ================================================================
        // 事件
        // ================================================================

        function onCanvasClick(e) {
            if (gameOver) return;
            if (mode === 'pve' && currentPlayer === WHITE) return;
            if (mode === 'pve' && isAIThinking) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            let minDist = cellSize * 0.6;
            let targetRow = -1,
                targetCol = -1;

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const px = padding + c * cellSize;
                    const py = padding + r * cellSize;
                    const dist = Math.sqrt((x - px) ** 2 + (y - py) ** 2);
                    if (dist < minDist) {
                        minDist = dist;
                        targetRow = r;
                        targetCol = c;
                    }
                }
            }

            if (targetRow >= 0 && targetCol >= 0) {
                placePiece(targetRow, targetCol);
            }
        }

        function onResize() {
            render();
        }

        function toggleStats() {
            showStats = !showStats;
            statsPanel.classList.toggle('hidden', !showStats);
            statToggle.textContent = showStats ? '📊 隐藏胜率' : '📊 显示胜率';
            statToggle.classList.toggle('active', showStats);
            if (showStats) {
                setTimeout(calculateWinRates, 50);
            }
        }

        // ================================================================
        // 启动
        // ================================================================

        function init() {
            initBoard();
            render();
            updateStatus();
            messageEl.textContent = '⚫ 黑棋先走';

            canvas.addEventListener('click', onCanvasClick);
            canvas.addEventListener('touchstart', onCanvasClick, { passive: false });
            window.addEventListener('resize', onResize);

            setTimeout(() => {
                if (showStats) calculateWinRates();
            }, 150);

            setTimeout(render, 50);
        }

        init();

        window.resetGame = resetGame;
        window.undoMove = undoMove;
        window.setMode = setMode;
        window.toggleStats = toggleStats;
    </script>

</body>
</html>
